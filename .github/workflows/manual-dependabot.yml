name: Manual Dependabot Scan

on:
  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:
  
  # Optional: Add schedule for regular checks
  # schedule:
  #   - cron: '0 0 * * 1' # Every Monday at midnight

jobs:
  dependabot:
    name: Trigger Dependabot Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # This step forces Dependabot to re-check dependencies
      - name: Update dependencies to trigger Dependabot
        run: |
          date > .github/dependabot-trigger.txt
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .github/dependabot-trigger.txt
          git commit -m "chore: trigger dependabot scan [skip ci]"
          git push
      
      # Alternatively, API call method (requires token with appropriate permissions)
      - name: Trigger Dependabot alerts with API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get latest commit SHA
          COMMIT_SHA=$(git rev-parse HEAD)
          
          # Create a temporary branch to trigger scans
          TEMP_BRANCH="dependabot-scan-trigger-$(date +%s)"
          git checkout -b $TEMP_BRANCH
          
          echo "Triggering Dependabot scan via GitHub API"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/code-scanning/analysis \
            -f tool_name='dependabot' \
            -f commit_sha=$COMMIT_SHA \
            -f ref=$TEMP_BRANCH || echo "API call failed, but scan might still be triggered by commit" 